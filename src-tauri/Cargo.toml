[package]
name = "nostak"
version = "0.1.3"
edition = "2021"

[lib]
name = "nostak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
ctrlc = "3.5.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }
